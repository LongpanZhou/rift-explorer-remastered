name: ci

# Runs the sidecar tests and builds the app on macOS (Apple Silicon and Intel), Windows
# and Linux (D6).
# The release live check (scripts/live_check.ts) needs a logged-in League
# client and is not run in CI.

on:
  push:
  pull_request:

jobs:
  macos:
    # Both Macs build on Apple Silicon; the Intel app is cross-compiled.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            arch: arm64
          - target: x86_64-apple-darwin
            bun_target: bun-darwin-x64-baseline
            arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the ASCII art converter
        run: bun run converter ${{ matrix.target }}
      - name: Sidecar tests (golden snapshot, unit, CLI exit codes)
        run: bun test
      - name: Build the sidecar
        run: bun build --compile --target=${{ matrix.bun_target }} app/util/sidecar-main.ts --outfile src-tauri/binaries/lcu-sidecar-${{ matrix.target }}
      - name: Build the app (ad hoc signed)
        run: bun run tauri build --target ${{ matrix.target }} --bundles app
      - name: Check the app is signed and built for ${{ matrix.arch }}
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rift Explorer Remastered.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/rift-explorer-tauri" | grep -qx ${{ matrix.arch }}
          lipo -archs "$APP/Contents/MacOS/lcu-sidecar" | grep -qx ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: rift-explorer-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the ASCII art converter for Windows
        run: bun run converter x86_64-pc-windows-msvc
      - name: Build the sidecar for Windows
        run: bun build --compile app/util/sidecar-main.ts --outfile src-tauri/binaries/lcu-sidecar-x86_64-pc-windows-msvc.exe
      - name: "Smoke test: sidecar finds no client and exits with a message (D6, criterion 5)"
        shell: pwsh
        run: |
          $stdout = & .\src-tauri\binaries\lcu-sidecar-x86_64-pc-windows-msvc.exe 2> err.txt
          $code = $LASTEXITCODE
          Write-Host "exit code: $code"
          Get-Content err.txt
          # With no League client running, the sidecar exits 2 (no Riot client)
          # or 3 (lockfile missing), and writes nothing to stdout.
          if ($stdout) { Write-Error "stdout must be empty when no client is running"; exit 1 }
          if ($code -ne 2 -and $code -ne 3) { Write-Error "expected exit 2 or 3, got $code"; exit 1 }
          # PowerShell reports the last native command's exit code, so end on a clean exit.
          exit 0
      - name: Build the app (no installer)
        run: bun run tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: rift-explorer-windows
          path: src-tauri/target/release/rift-explorer-tauri.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the ASCII art converter for Linux
        run: bun run converter x86_64-unknown-linux-gnu
      - name: Sidecar tests (golden snapshot, unit, CLI exit codes)
        run: bun test
      - name: Build the sidecar for Linux
        run: bun build --compile app/util/sidecar-main.ts --outfile src-tauri/binaries/lcu-sidecar-x86_64-unknown-linux-gnu
      - name: Build the app (no installer)
        run: bun run tauri build --no-bundle
      - name: App tests (phone page start, busy port, missing lockfile)
        run: cargo test --manifest-path src-tauri/Cargo.toml
