name: release

# Builds the app for macOS (Apple Silicon), Windows and Linux, then publishes the
# installers to a GitHub release. Runs when a version tag (v*) is pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            sidecar: lcu-sidecar-aarch64-apple-darwin
          - os: windows-latest
            sidecar: lcu-sidecar-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            sidecar: lcu-sidecar-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Tests
        if: runner.os != 'Windows'
        run: bun test
      - name: Sidecar for this platform
        run: bun build --compile app/util/sidecar-main.ts --outfile src-tauri/binaries/${{ matrix.sidecar }}
      - name: Build and publish the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Rift Explorer Remastered ${{ github.ref_name }}"
          releaseBody: "Installers for macOS (Apple Silicon), Windows and Linux. Builds are unsigned."
          releaseDraft: false
          prerelease: false
