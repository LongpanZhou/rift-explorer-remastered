name: release

# One file per platform, named for the app, the version and the platform:
#   macOS (Apple Silicon)  APP_SLUG-VERSION-macos-arm64.zip   (the .app; unzip, then open it)
#   macOS (Intel)          APP_SLUG-VERSION-macos-x64.zip     (the .app; unzip, then open it)
#   Windows (x64)          APP_SLUG-VERSION-windows-x64.exe   (one file, run it)
#   Linux (x86_64)         APP_SLUG-VERSION-linux-x86_64.AppImage   (chmod +x, then run)
# Runs when a version tag (v*) is pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_SLUG: "Rift-Explorer-Remastered"
  APP_EXE: "rift-explorer-tauri"
  PRODUCT: "Rift Explorer Remastered"
  NOTES: 'Downloads: macOS .zip (Apple Silicon: macos-arm64, Intel: macos-x64; unzip and open the app), Windows .exe, Linux .AppImage. Builds are not notarized: on macOS, if the app is blocked, open System Settings > Privacy & Security and click Open Anyway.'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Create the release once, before the builds
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" --title "$PRODUCT $TAG" --notes "$NOTES"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs build on Apple Silicon; the Intel app is cross-compiled.
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            triple: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            sidecar: lcu-sidecar-aarch64-apple-darwin
          - os: macos-14
            platform: macos-x64
            target: x86_64-apple-darwin
            triple: x86_64-apple-darwin
            bun_target: bun-darwin-x64-baseline
            sidecar: lcu-sidecar-x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            triple: x86_64-pc-windows-msvc
            sidecar: lcu-sidecar-x86_64-pc-windows-msvc.exe
          - os: ubuntu-22.04
            platform: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            sidecar: lcu-sidecar-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - run: bun install --frozen-lockfile
      - name: Tests
        if: runner.os != 'Windows'
        run: bun test
      - name: Sidecar for this platform
        if: runner.os != 'macOS'
        run: bun build --compile app/util/sidecar-main.ts --outfile src-tauri/binaries/${{ matrix.sidecar }}
      - name: Sidecar for this Mac
        if: runner.os == 'macOS'
        run: bun build --compile --target=${{ matrix.bun_target }} app/util/sidecar-main.ts --outfile src-tauri/binaries/${{ matrix.sidecar }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: ASCII art converter for this platform
        run: bun run converter ${{ matrix.triple }}

      - name: Build the macOS app (.app)
        if: runner.os == 'macOS'
        run: bun run tauri build --target ${{ matrix.target }} --bundles app
      - name: Build the Linux app (.AppImage)
        if: runner.os == 'Linux'
        run: bun run tauri build --bundles appimage
      - name: Build the Windows app (no installer)
        if: runner.os == 'Windows'
        run: bun run tauri build --no-bundle

      - name: Publish the macOS file
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="${APP_SLUG}-${VERSION}-${{ matrix.platform }}.zip"
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/${PRODUCT}.app"
          # The app must be signed (ad hoc, "-") or Apple Silicon refuses to open it at all.
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/${APP_EXE}" | grep -qx "${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}"
          lipo -archs "$APP/Contents/MacOS/lcu-sidecar" | grep -qx "${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}"
          # ditto keeps the bundle's symlinks, permissions and signature; Finder unzips it to the .app.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          gh release upload "$GITHUB_REF_NAME" "$OUT" -R "$GITHUB_REPOSITORY" --clobber
      - name: Publish the Linux file
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="${APP_SLUG}-${VERSION}-${{ matrix.platform }}.AppImage"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$OUT"
          gh release upload "$GITHUB_REF_NAME" "$OUT" -R "$GITHUB_REPOSITORY" --clobber
      - name: Publish the Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $out = "$($env:APP_SLUG)-$version-${{ matrix.platform }}.exe"
          Copy-Item "src-tauri/target/release/$($env:APP_EXE).exe" $out
          gh release upload $env:GITHUB_REF_NAME $out -R $env:GITHUB_REPOSITORY --clobber
